# pnpm 工作区配置
packages:
  - '.'

# 安全 override：把传递依赖顶到已修复的补丁版本。
#
# 必须与 package.json 的 pnpm.overrides 保持一致 —— 两份不是冗余：
# pnpm 9 只读 package.json 的 pnpm.overrides，pnpm 11 只读这里。
# 本仓库用 packageManager 钉在 9.15.9，但全局 pnpm 已是 11；
# 哪天钉子松了，只写一处会被静默忽略，15 个漏洞悄悄回来且不报错。
overrides:
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  hono@<4.12.34: ^4.12.34
  '@hono/node-server@<2.0.5': ^2.0.5
  ip-address@<=10.3.0: ^10.3.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  tar@<7.5.22: ^7.5.22
  undici@<6.28.0: ^6.28.0

# minimumReleaseAge 策略说明：
# pnpm v11+ 默认要求包发布后至少等待 1440 分钟（24小时）才能安装，
# 以防范供应链攻击（如包被恶意篡改后立即推送）。
#
# 将其设置为 0 可以绕过此限制，适用于需要使用最新包的开发场景。
# 受影响的包：@parcel/watcher@2.6.0, lightningcss@1.33.0
minimumReleaseAge: 0

# pnpm v11+ 默认会忽略某些包的构建脚本，在此明确批准
allowBuilds:
  '0': '@parcel/watcher'
  '1': core-js
  '2': cpu-features
  '3': dugite
  '4': electron
  '5': electron-winstaller
  '6': esbuild
  '7': node-pty
  '8': protobufjs
  '9': sharp
  '10': ssh2
  '@parcel/watcher': set this to true or false
  core-js: set this to true or false
  cpu-features: set this to true or false
  dugite: set this to true or false
  electron: set this to true or false
  electron-winstaller: set this to true or false
  esbuild: set this to true or false
  node-pty: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  ssh2: set this to true or false
