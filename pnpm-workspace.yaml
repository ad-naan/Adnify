# pnpm 工作区配置
packages:
  - '.'

# pnpm 11 的唯一项目级配置入口。package.json 不再保留一份会被忽略的
# overrides/patches 副本，避免安全约束看似存在、实际不生效。
# 强制本机 Node/pnpm 与 package.json engines + packageManager 一致。
engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true

# 安装必须是显式步骤。运行 test/build 时发现依赖状态变化就直接执行目标，
# 不让 pnpm 在后台隐式重装整棵依赖树。
verifyDepsBeforeRun: false

# 扁平化 node_modules（原 .npmrc 的 node-linker=hoisted / shamefully-hoist=true
# / public-hoist-pattern=* 三项，随 .npmrc 删除后必须在此保留）。
#
# 这不是偏好，而是打包正确性的前提：package.json 的 asarUnpack 用
# `node_modules/<pkg>/**` 形式匹配需要解包的原生模块。传递依赖里的原生模块
# —— 例如 ssh2 依赖的 cpu-features —— 只有在扁平布局下才位于顶层，
# 否则它落在 node_modules/.pnpm/<pkg>@<version>/node_modules/<pkg>，
# asarUnpack 规则匹配不到任何文件，.node 二进制被打进 asar 而无法加载。
# ssh2 对 cpu-features 的 require 有 try/catch 兜底，缺失时不会崩溃，
# 只会静默丢失 CPU 特性检测带来的加密加速 —— 属于不报错的性能回归。
nodeLinker: hoisted
shamefullyHoist: true
publicHoistPattern:
  - '*'

# 安全 override：把传递依赖顶到已修复的补丁版本。
#
overrides:
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  '@xmldom/xmldom@>=0.8.0 <0.8.15': ^0.8.15
  browserslist@<4.28.7: ^4.28.7
  hono@<4.12.34: ^4.12.34
  '@hono/node-server@<2.0.5': ^2.0.5
  ip-address@<=10.3.0: ^10.3.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  tar@<7.5.22: ^7.5.22
  undici@<6.28.0: ^6.28.0
  dompurify@<3.4.13: ^3.4.13
  sharp@<0.35.0: ^0.35.1
  protobufjs@<7.6.3: ^7.6.3

# Electron installs through extract-zip 2.0.1 and upstream has no fixed
# release. The repository patch preserves internal symlinks while rejecting
# targets that resolve outside the extraction root.
patchedDependencies:
  'extract-zip@2.0.1': patches/extract-zip@2.0.1.patch

# minimumReleaseAge 策略说明：
# pnpm v11+ 默认要求包发布后至少等待 1440 分钟（24小时）才能安装，
# 以防范供应链攻击（如包被恶意篡改后立即推送）。
#
# 将其设置为 0 可以绕过此限制，适用于需要使用最新包的开发场景。
# 受影响的包：@parcel/watcher@2.6.0, lightningcss@1.33.0
minimumReleaseAge: 0

# pnpm v11+ 默认会忽略某些包的构建脚本，在此明确批准
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  cpu-features: true
  dugite: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true
  ssh2: true
