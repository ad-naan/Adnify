main: &validation
  push:
    - &linux-check
      name: validate-linux
      docker:
        image: node:24.19.0-bookworm
      stages:
        - name: Set up Linux toolchain
          script: &linux-setup
            - apt-get update
            - apt-get install -y --no-install-recommends build-essential python3 python3-setuptools pkg-config libarchive-tools
            - npm install --global pnpm@11.22.0
        - name: Type check, test and build
          script: node scripts/cnb-ci.js validate
    - name: validate-windows
      runner:
        namespace: group
        tags: [windows, x64]
      stages:
        - name: Type check, test and build
          script: node scripts/cnb-ci.js validate
  pull_request:
    - *linux-check

master: *validation

"v*":
  tag_push:
    - name: publish-release
      lock:
        key: adnify-public-release
        expires: 7200
      docker:
        image: node:24.19.0-bookworm
      stages:
        - name: Prepare draft
          script: node scripts/cnb-ci.js prepare
        - name: Draft ready
          type: cnb:resolve
          options:
            key: release-ready
        - name: Wait for Windows x64
          type: cnb:await
          options:
            key: windows-x64
        - name: Wait for Windows arm64
          type: cnb:await
          options:
            key: windows-arm64
        - name: Wait for macOS x64
          type: cnb:await
          options:
            key: macos-x64
        - name: Wait for macOS arm64
          type: cnb:await
          options:
            key: macos-arm64
        - name: Wait for Linux x64
          type: cnb:await
          options:
            key: linux-x64
        - name: Wait for Linux arm64
          type: cnb:await
          options:
            key: linux-arm64
        - name: Verify attachments and publish
          script: node scripts/cnb-ci.js publish

    - name: windows-x64
      runner:
        namespace: group
        tags: [windows, x64]
      env:
        ADNIFY_TARGET: windows-x64
      stages:
        - &await-release
          name: Wait for release draft
          type: cnb:await
          options:
            key: release-ready
        - &package-release
          name: Package and upload
          script: node scripts/cnb-ci.js package
        - name: Windows x64 ready
          type: cnb:resolve
          options:
            key: windows-x64
    - name: windows-arm64
      runner:
        namespace: group
        tags: [windows, arm64]
      env:
        ADNIFY_TARGET: windows-arm64
      stages:
        - *await-release
        - *package-release
        - name: Windows arm64 ready
          type: cnb:resolve
          options:
            key: windows-arm64
    - name: macos-x64
      runner:
        namespace: group
        tags: [macos, x64]
      env:
        ADNIFY_TARGET: macos-x64
      stages:
        - *await-release
        - *package-release
        - name: macOS x64 ready
          type: cnb:resolve
          options:
            key: macos-x64
    - name: macos-arm64
      runner:
        namespace: group
        tags: [macos, arm64]
      env:
        ADNIFY_TARGET: macos-arm64
      stages:
        - *await-release
        - *package-release
        - name: macOS arm64 ready
          type: cnb:resolve
          options:
            key: macos-arm64
    - name: linux-x64
      runner:
        tags: cnb:arch:amd64
      docker:
        image: node:24.19.0-bookworm
      env:
        ADNIFY_TARGET: linux-x64
      stages:
        - *await-release
        - &release-linux-setup
          name: Set up Linux toolchain
          script: *linux-setup
        - *package-release
        - name: Linux x64 ready
          type: cnb:resolve
          options:
            key: linux-x64
    - name: linux-arm64
      runner:
        tags: cnb:arch:arm64:v8
      docker:
        image: node:24.19.0-bookworm
      env:
        ADNIFY_TARGET: linux-arm64
      stages:
        - *await-release
        - *release-linux-setup
        - *package-release
        - name: Linux arm64 ready
          type: cnb:resolve
          options:
            key: linux-arm64
