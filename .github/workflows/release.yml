name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-windows:
    needs: get-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Package Windows ${{ matrix.arch }}
        run: pnpm exec electron-builder --win --${{ matrix.arch }} -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Smoke test packaged app
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          APP="release/win-unpacked/Adnify.exe"
          if [ ! -f "$APP" ]; then echo "App binary not found"; exit 1; fi
          # Start app, wait for main process to initialize, then check it's still running
          "$APP" &
          APP_PID=$!
          sleep 8
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✓ App started successfully (PID: $APP_PID)"
            kill $APP_PID 2>/dev/null || true
          else
            echo "✗ App crashed during startup"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.yml
            release/*.yaml
            release/*.blockmap
          if-no-files-found: ignore


  build-macos:
    needs: get-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: macos-15-intel
          - arch: arm64
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install setuptools (for node-gyp)
        run: pip install setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v4


      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable Spotlight indexing (prevents hdiutil resource busy)
        run: |
          sudo mdutil -a -i off
          sudo mdutil -a -d
          # Kill any mds processes that might hold file locks
          sudo killall -9 mds mds_stores mdworker mdworker_shared 2>/dev/null || true
          sleep 3

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Package macOS ${{ matrix.arch }}
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Smoke test packaged app
        shell: bash
        run: |
          APP_PATH="$(find release -maxdepth 3 -type d -name 'Adnify.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then echo "App bundle not found"; exit 1; fi
          APP_PATH="$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")"
          "$APP_PATH/Contents/MacOS/Adnify" &
          APP_PID=$!
          sleep 8
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✓ App started successfully (PID: $APP_PID)"
            kill $APP_PID 2>/dev/null || true
          else
            echo "✗ App crashed during startup"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.yaml
            release/*.blockmap
          if-no-files-found: ignore

  build-linux:
    needs: get-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install setuptools (for node-gyp)
        run: pip install setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v4


      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Package Linux ${{ matrix.arch }}
        run: pnpm exec electron-builder --linux --${{ matrix.arch }} -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.yml
            release/*.yaml
          if-no-files-found: ignore


  release:
    needs: [get-version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Generate Release Notes
        run: node scripts/generate-release-notes.js ${{ needs.get-version.outputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          # 拷贝主安装包
          find artifacts -type f -name "Adnify-Setup-*.exe" -exec cp {} release-files/ \;
          find artifacts -type f -name "*.dmg" -exec cp {} release-files/ \;
          find artifacts -type f -name "*-mac.zip" -exec cp {} release-files/ \;
          find artifacts -type f -name "*.AppImage" -exec cp {} release-files/ \;
          
          # 拷贝 blockmap 文件（自动更新需要）
          find artifacts -type f -name "*.blockmap" -exec cp {} release-files/ \;
          
          # 处理 yml 文件 - 按架构重命名避免覆盖
          # Windows x64
          if [ -f "artifacts/windows-x64/latest.yml" ]; then
            cp artifacts/windows-x64/latest.yml release-files/latest.yml
          fi
          # Windows arm64
          if [ -f "artifacts/windows-arm64/latest.yml" ]; then
            cp artifacts/windows-arm64/latest.yml release-files/latest-arm64.yml
          fi
          # macOS x64
          if [ -f "artifacts/macos-x64/latest-mac.yml" ]; then
            cp artifacts/macos-x64/latest-mac.yml release-files/latest-mac.yml
          fi
          # macOS arm64
          if [ -f "artifacts/macos-arm64/latest-mac.yml" ]; then
            cp artifacts/macos-arm64/latest-mac.yml release-files/latest-arm64-mac.yml
          fi
          # Linux x64
          if [ -f "artifacts/linux-x64/latest-linux.yml" ]; then
            cp artifacts/linux-x64/latest-linux.yml release-files/latest-linux.yml
          fi
          # Linux arm64
          if [ -f "artifacts/linux-arm64/latest-linux.yml" ]; then
            cp artifacts/linux-arm64/latest-linux.yml release-files/latest-linux-arm64.yml
          fi
          
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: Adnify v${{ needs.get-version.outputs.version }}
          body_path: RELEASE_BODY.md
          files: release-files/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  sync-to-gitee:
    needs: [get-version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Generate Release Notes
        run: node scripts/generate-release-notes.js ${{ needs.get-version.outputs.version }}

      - name: Sync code to Gitee
        run: |
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/adnaan/adnify.git
          git push gitee --all --force
          git push gitee --tags --force
        continue-on-error: true

      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          TAG="v$VERSION"
          BODY=$(cat RELEASE_BODY.md)
          
          PAYLOAD=$(jq -n \
            --arg token "$GITEE_TOKEN" \
            --arg tag "$TAG" \
            --arg name "Adnify v$VERSION" \
            --arg body "$BODY" \
            '{access_token: $token, tag_name: $tag, target_commitish: "master", name: $name, body: $body, prerelease: false}')
          
          RESPONSE=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/adnaan/adnify/releases" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          echo "Create release response: $RESPONSE"
          
          RELEASE_ID=$(echo $RESPONSE | jq -r '.id // empty')
          
          if [ -n "$RELEASE_ID" ]; then
            echo "✅ Gitee Release created successfully, ID: $RELEASE_ID"
          else
            echo "Release may already exist or creation failed"
          fi
