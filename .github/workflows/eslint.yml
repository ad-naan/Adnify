# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '37 2 * * 3'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install ESLint and TypeScript Parser
        run: |
          mkdir -p "$RUNNER_TEMP/eslint-tools"
          cd "$RUNNER_TEMP/eslint-tools"
          npm init -y
          npm install --no-package-lock --no-save eslint@8.57.0 @typescript-eslint/parser@6.21.0 @typescript-eslint/eslint-plugin@6.21.0 typescript@5.3.3 eslint-plugin-react-hooks@4.6.2 @microsoft/eslint-formatter-sarif@3.1.0

      - name: Copy repository ESLint config
        run: |
          cp "$GITHUB_WORKSPACE/.eslintrc.cjs" "$RUNNER_TEMP/eslint-tools/.eslintrc.cjs"

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          cd "$GITHUB_WORKSPACE"
          node "$RUNNER_TEMP/eslint-tools/node_modules/eslint/bin/eslint.js" . \
            --no-eslintrc \
            --ignore-path .gitignore \
            --config "$RUNNER_TEMP/eslint-tools/.eslintrc.cjs" \
            --resolve-plugins-relative-to "$RUNNER_TEMP/eslint-tools" \
            --ext .js,.jsx,.ts,.tsx \
            --format @microsoft/eslint-formatter-sarif \
            --output-file "$GITHUB_WORKSPACE/eslint-results.sarif"
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
