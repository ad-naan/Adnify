name: Legacy updater bridge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published CNB tag to offer to existing GitHub updater clients
        required: true
        type: string

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Mirror the published CNB release
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base=https://cnb.cool/aadnaan/Adnify/-/releases
          mkdir artifacts
          curl --fail --silent --show-error -H 'Accept: application/vnd.cnb.api+json' \
            "$base/tags/$TAG" > release.json
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .prerelease == false' release.json
          jq -r '.body // ""' release.json > notes.md
          printf '\n[Download on CNB](%s/tags/%s)\n' "$base" "$TAG" >> notes.md
          jq -er '.assets[].name' release.json > assets.txt
          while IFS= read -r file; do
            [[ "$file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            curl --fail --silent --show-error --location --retry 3 \
              "$base/download/$TAG/$file" -o "artifacts/$file"
          done < assets.txt
          # Older builds already pass a platform suffix as part of the channel name.
          cp artifacts/latest-mac.yml artifacts/latest-mac-mac.yml
          cp artifacts/latest-arm64-mac.yml artifacts/latest-arm64-mac-mac.yml
          cp artifacts/latest-linux.yml artifacts/latest-linux-linux.yml
          cp artifacts/latest-linux-arm64.yml artifacts/latest-linux-arm64-linux-arm64.yml
          gh release create "$TAG" artifacts/* --verify-tag --title "Adnify $TAG" --notes-file notes.md --latest
